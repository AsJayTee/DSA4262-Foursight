# The current best configuration with a smaller boosting budget.
#
# NOTHING in configs/ has ever been tuned (GAPS.md, Modelling). The one value
# with any evidence against it is n_estimators: a training curve taken while
# LightGBM still reported one showed held-out PR AUC on configs/quantiles.yaml
# peaking at round 431 and the config running to 600 - so the last ~170 rounds
# were costing ~0.005 of mean per-fold PR AUC.
#
# That measurement was on a different feature set (101 columns, no flanks, no
# depth augmentation) and on runs that have since been deleted, so it does not
# transfer. This config is the legitimate way to act on it: change ONE value,
# run it, and compare the two configs paired like any other pair of runs.
#
# ONE value, ONE comparison. Reading a peak off a curve and then quoting the
# same run's score is the flat-tuning trap GAPS.md records; trying six budgets
# and reporting the best is the same trap wearing a different hat.
#
#   python scripts/evaluate.py --config configs/best_shorter.yaml \
#          --compare-with configs/quantiles_flank_depth_augmented.yaml
name: best_shorter
features: quantiles_flank_v1
model: lightgbm
model_params:
  learning_rate: 0.05
  num_leaves: 63
  n_estimators: 450
  min_child_samples: 40
  feature_fraction: 0.7
train_depths: [1, 3, 5, 10, null]
split:
  seed: 4262        # DO NOT CHANGE - see AGENTS.md
  n_folds: 5
  group_by: gene_id
notes: >
  configs/quantiles_flank_depth_augmented.yaml with n_estimators 600 -> 450 and
  nothing else changed. The only hyperparameter in the repo with any evidence
  against it, tested once rather than searched.
