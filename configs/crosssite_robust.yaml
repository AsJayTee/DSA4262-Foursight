# The shippable cross-site model, and the likely final one.
#
# Cross-site features are the largest effect in the project (up to +0.0286,
# 50/50, corrected p = 0.0000) and most of them cannot go in models/final/,
# because predict.py runs on an evaluation file whose candidate density nobody
# here knows. Halving the site count and re-extracting biases counts by 0.43 to
# 0.93 standard deviations and windowed maxima by 0.76 or more.
#
# This keeps only what survives: relative position along the transcript
# (bias 0.006) and the transcript-level leave-one-out means (bias 0.008-0.085).
# A normalised position is preserved under random thinning and a mean is
# unbiased at any sample size; a count and a max are neither.
#
# Combined with the two other things that have been established - the 7-mer
# flanks (+0.0109) and depth-augmented training - so this is the full candidate
# rather than another isolated arm.
#
#   python scripts/evaluate.py --config configs/crosssite_robust.yaml \
#          --compare-with configs/quantiles_flank_depth_augmented.yaml
name: crosssite_robust
features: quantiles_crosssite_robust_v1
model: lightgbm
model_params:
  learning_rate: 0.05
  num_leaves: 63
  n_estimators: 600
  min_child_samples: 40
  feature_fraction: 0.7
train_depths: [1, 3, 5, 10, null]
split:
  seed: 4262        # DO NOT CHANGE - see AGENTS.md
  n_folds: 5
  group_by: gene_id
notes: >
  NOTE this feature set does NOT include the flank columns - it is
  quantiles_v1 + robust cross-site. Compared against
  quantiles_flank_depth_augmented it therefore asks whether robust cross-site
  beats the flanks, not whether they stack. Stacking is a further config.
