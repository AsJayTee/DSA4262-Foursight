[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m6a"
version = "0.1.0"
description = "m6A RNA modification prediction from Nanopore direct RNA-seq (DSA4262 Foursight)"
requires-python = ">=3.10"

# Base deps. These are what an evaluator installs to run `predict.py`.
# Keep this list small — every addition is something that can fail on
# someone else's machine. Heavy/optional deps go in [project.optional-dependencies].
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training only: never imported by predict.py.
train = ["wandb>=0.16", "boto3>=1.34", "python-dotenv>=1.0"]
# Experimental MIL models. Deliberately isolated — see AGENTS.md.
mil = ["torch>=2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
