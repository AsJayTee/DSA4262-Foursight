[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m6a"
version = "0.1.0"
description = "m6A RNA modification prediction from Nanopore direct RNA-seq (DSA4262 Foursight)"
requires-python = ">=3.10"

# Base deps. These are what an evaluator installs to run `predict.py`.
# Keep this list small — every addition is something that can fail on
# someone else's machine. Heavy/optional deps go in [project.optional-dependencies].
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    # Declared, not inherited. scikit-learn installs joblib anyway, which is why
    # this was missing for so long - but m6a.models.baseline imports it directly
    # in save/load, and predict.py calls load. A direct import on the graded path
    # has to be a declared dependency. See docs/decisions/0011.
    "joblib>=1.3",
]

[project.optional-dependencies]
# Training and evaluation only: never imported by predict.py.
# scipy is already installed on most machines as a transitive dependency of
# scikit-learn. It is named here because m6a.compare imports it directly for
# the paired t-test, and a direct import should be a declared dependency
# rather than a lucky accident of someone else's dependency tree.
# matplotlib is here and not in the base list for the same reason: the figures
# an evaluation logs to W&B are training-side work, and predict.py must never
# import a plotting library. m6a.figures imports it inside each function.
train = [
    "wandb>=0.16",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
# Experimental MIL models. Deliberately isolated — see AGENTS.md.
mil = ["torch>=2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
