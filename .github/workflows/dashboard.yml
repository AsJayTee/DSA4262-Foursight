# Build dashboard/ (Vite + React) and publish it to GitHub Pages (decision 0035).
# Runs when dashboard/ or this file changes on main, or by hand (Actions tab).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # The Explore page's data (~90 MB) is not in git (report/task2_plan.md, 5.3): it is
      # attached to the GitHub Release "site-data" (dashboard/README.md, "Publish the site
      # data"). Without it the site still builds; Explore then says its data is missing.
      - name: Fetch the site data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/data/sites
          if gh release download site-data --repo "$GITHUB_REPOSITORY" --pattern site-data.tar --dir "$RUNNER_TEMP"; then
            tar -xf "$RUNNER_TEMP/site-data.tar" -C public/data/sites
          else
            echo "::warning::No site-data release found; the Explore page will have no data."
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
